plugins {
    alias(libs.plugins.android.application)
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

def apiBaseUrl = localProperties.getProperty('API_BASE_URL')
if (apiBaseUrl == null) {
    throw new GradleException("API_BASE_URL is missing from local.properties. Copy local.properties.example and fill in your values.")
}


android {
    namespace 'com.example.smart_solar_mobile'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.smart_solar_mobile"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders["MAPS_API_KEY"] = localProperties.getProperty("MAPS_API_KEY", "")

        buildConfigField "String", "API_BASE_URL", "\"${apiBaseUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.recyclerview
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    implementation libs.retrofit.core
    implementation libs.retrofit.converter.gson

    implementation libs.room.runtime
    annotationProcessor libs.room.compiler

    implementation libs.play.services.maps
    implementation libs.play.services.location

    implementation(libs.zxing.embedded) {
        exclude group: 'com.intellij', module: 'annotations'
    }
    implementation libs.zxing.core
}

configurations.all {
    exclude group: 'com.intellij', module: 'annotations'
}